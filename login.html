{% extends "base.html" %}

{% block title %}Sign In – BriefIQ Intelligence Platform{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 16px; width: 44px; height: 44px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                </svg>
            </div>
            <h1 class="auth-title">Welcome to BriefIQ</h1>
            <p class="auth-subtitle">Sign in to manage your summaries and document history</p>
        </div>


        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="identifier">Username or Email</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    class="form-input"
                    placeholder="Enter your username or email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 10px;">
                Sign In &rarr;
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account yet?
            <a href="{{ url_for('register') }}" style="font-weight: 600; color: var(--accent-cyan);">Create one for free</a>
        </div>
    </div>
</div>
{% endblock %}
